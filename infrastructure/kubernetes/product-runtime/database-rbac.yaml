# Operator API only. Customer portal runs without this service account. Every
# provisioning request verifies a product and uses its fixed namespace/name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: revos-product-database-provisioner
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [get, create]
  - apiGroups: ['']
    resources: [secrets, persistentvolumeclaims, services]
    verbs: [create]
  - apiGroups: ['']
    resources: [secrets, persistentvolumeclaims, services]
    resourceNames: [product-database]
    verbs: [get]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [create]
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [product-database]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: revos-product-database-provisioner
subjects:
  - kind: ServiceAccount
    name: agent-engine
    namespace: agent-engine-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: revos-product-database-provisioner

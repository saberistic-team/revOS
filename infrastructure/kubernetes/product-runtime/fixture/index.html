<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backend delivery fixture</title>
<style>body{font:16px system-ui;background:#f5f7fa;color:#172034;margin:0;padding:8vh 24px}main{max-width:650px;margin:auto;background:white;border:1px solid #dce3ed;border-radius:20px;padding:36px}h1{font-size:28px;margin:8px 0}p{line-height:1.6;color:#54647c}small{color:#63748b}form{display:flex;gap:8px;margin:24px 0}input{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:8px;padding:12px;font:inherit}button{background:#2254d4;color:white;border:0;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer}li{padding:12px 0;border-bottom:1px solid #edf0f5}ul{list-style:none;padding:0}#status{font-size:14px;color:#187342}#error{color:#b42318}</style>
<main><small>revOS · LOCAL RUNTIME CHECK</small><h1>Requirements that stay saved</h1><p>This synthetic product runs a backend and PostgreSQL in Kubernetes. Its saved requirements survive application releases.</p><div id="status">Checking service…</div><form id="form"><input id="title" placeholder="Add a test requirement" aria-label="Requirement" maxlength="200" required><button>Add</button></form><p id="error" role="alert"></p><ul id="items"></ul><small>Synthetic data only. This local fixture has no sign-in.</small></main>
<script>async function refresh(){try{const [h,r]=await Promise.all([fetch('/health'),fetch('/items')]);if(!h.ok||!r.ok)throw Error('Service unavailable');const data=await r.json();document.querySelector('#status').textContent='Backend and database are healthy';const list=document.querySelector('#items');list.replaceChildren(...data.items.map(i=>{const li=document.createElement('li');li.textContent=i.title;return li}));}catch(e){document.querySelector('#error').textContent=e.message}}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#title');const r=await fetch('/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:input.value})});if(r.ok){input.value='';await refresh()}else document.querySelector('#error').textContent='Could not save the requirement'};refresh();</script></html>

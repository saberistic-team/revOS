apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: agent-engine-worker
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: engine-config
            - secretRef:
                name: engine-secrets
            - secretRef:
                name: openai-secrets
                optional: true
            - secretRef:
                name: forgejo-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16
          env:
            - {name: FORGEJO__security__INSTALL_LOCK, value: "true"}
            - {name: FORGEJO__database__DB_TYPE, value: "sqlite3"}
            - {name: FORGEJO__database__PATH, value: "/data/gitea/forgejo.db"}
            - {name: FORGEJO__server__ROOT_URL, value: "http://localhost:3001/"}
            - {name: FORGEJO__server__DISABLE_SSH, value: "true"}
            - {name: FORGEJO__service__DISABLE_REGISTRATION, value: "true"}
            - {name: FORGEJO__service__REQUIRE_SIGNIN_VIEW, value: "true"}
            - {name: FORGEJO__repository__DEFAULT_PRIVATE, value: "private"}
            - {name: FORGEJO__repository__DEFAULT_BRANCH, value: "main"}
          ports:
            - {containerPort: 3000}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            httpGet: {path: /api/healthz, port: 3000}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: forgejo-data}
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
spec:
  selector: {app: forgejo}
  ports:
    - {port: 3000, targetPort: 3000}

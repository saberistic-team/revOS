# Official Temporal auto-setup image, all services in one local-only process.
# Persistence and visibility are separate PostgreSQL databases owned by temporal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: temporal }
  template:
    metadata:
      labels: { app: temporal }
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-postgres
          image: postgres:16.10-bookworm
          command:
            [
              sh,
              -c,
              "until pg_isready -h postgres -p 5432 -U temporal -t 1; do sleep 1; done",
            ]
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.29.1
          envFrom:
            - secretRef: { name: temporal-secrets }
          env:
            - { name: BIND_ON_IP, value: "0.0.0.0" }
            - { name: DB, value: postgres12 }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_SEEDS, value: postgres }
            - { name: DBNAME, value: temporal_persistence }
            - { name: VISIBILITY_DBNAME, value: temporal_visibility }
            - { name: DEFAULT_NAMESPACE, value: default }
            - { name: NUM_HISTORY_SHARDS, value: "4" }
          ports:
            - containerPort: 7233
          readinessProbe:
            tcpSocket: { port: 7233 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
spec:
  selector: { app: temporal }
  ports:
    - port: 7233
      targetPort: 7233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels: { app: temporal-ui }
  template:
    metadata:
      labels: { app: temporal-ui }
    spec:
      enableServiceLinks: false
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.42.1
          env:
            - { name: TEMPORAL_ADDRESS, value: "temporal-frontend:7233" }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
spec:
  selector: { app: temporal-ui }
  ports:
    - port: 8080
      targetPort: 8080

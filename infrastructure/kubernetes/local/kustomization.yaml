apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-engine-local
resources:
  - ../base
  - namespace.yaml
  - postgres.yaml
  - temporal.yaml
  - forgejo.yaml
  - openhands.yaml
  - openhands-web.yaml
configMapGenerator:
  - name: engine-config
    literals:
      - TEMPORAL_ADDRESS=temporal-frontend:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=agent-engine
      - MODEL_PROVIDER=mock
secretGenerator:
  # Intentionally public, disposable local credentials. Never use in production.
  - name: engine-secrets
    literals:
      - DATABASE_URL=postgresql://engine:engine-local-only@postgres:5432/agent_engine
  - name: postgres-secrets
    literals:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres-local-only
      - POSTGRES_DB=agent_engine
  - name: temporal-secrets
    literals:
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal-local-only

patches:
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value: [{name: OPENHANDS_IMAGE, value: "agent-engine-openhands:1.49.1-chat"}, {name: OPENHANDS_MODEL, value: "openai/gpt-6-astra"}, {name: OPENHANDS_MAX_ITERATIONS, value: "200"}]
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: engine-build-worker
      - op: add
        path: /spec/template/spec/securityContext
        value: {fsGroup: 1000}
      - op: add
        path: /spec/template/spec/volumes
        value: [{name: build-data, persistentVolumeClaim: {claimName: build-data}}]
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value: [{name: build-data, mountPath: /build-data}]
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value: [{name: build-data, persistentVolumeClaim: {claimName: build-data}}]
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value: [{name: build-data, mountPath: /build-data}]
